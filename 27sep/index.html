
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Card Animation HTML CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cards">
    <div class="outer">
      <div class="card" style="--delay:-1;">
        <div class="content">
          <div class="img">
            <img decoding="async" src="./ig/Ironman.jpg">
          </div>
          <div class="details">
            <span class="name">Iron Man</span>
            <p>Frontend Developer</p>
          </div>
        </div>
        <a href="#">Follow</a>
      </div>
      <div class="card" style="--delay:0;">
        <div class="content">
          <div class="img">
            <img decoding="async" src="./ig/Spiderman.jpg">
          </div>
          <div class="details">
            <span class="name">Spider Man</span>
            <p>Full-stack Developer</p>
          </div>
        </div>
        <a href="#">Follow</a>
      </div>
      <div class="card" style="--delay:1;">
        <div class="content">
          <div class="img">
            <img decoding="async" src="./ig/Venom.jpg">
          </div>
          <div class="details">
            <span class="name">Venom</span>
            <p>Tester</p>
          </div>
        </div>
        <a href="#">Follow</a>
      </div>
      <div class="card" style="--delay:2;">
        <div class="content">
          <div class="img">
            <img decoding="async" src="./ig/Batman.jpg">
          </div>
          <div class="details">
            <span class="name">Batman</span>
            <p>Backend Developer</p>
          </div>
        </div>
        <a href="#">Follow</a>
      </div>
      <div class="card" style="--delay:2;">
        <div class="content">
          <div class="img">
            <img decoding="async" src="./ig/Superman.jpg">
          </div>
          <div class="details">
            <span class="name">Superman</span>
            <p>Youtuber</p>
          </div>
        </div>
        <a href="#">Follow</a>
      </div>



    </div>
  </div>
     
</body>
</html>
